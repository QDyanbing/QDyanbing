name: Update profile statistics

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=flag-india&hide_border=true
          path: assets/generated/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.4
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=flag-india&hide_border=true
          path: assets/generated/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.4
          fail_on_error: true

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@9b38b03cac7ffb9f093a82f0ea9c634d5df62297
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=ffffff&color=57606a&line=1677ff&point=69b1ff&area=true&area_color=91caff&hide_border=true&hide_title=true
          output_path: assets/generated/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate activity graph
        shell: bash
        run: |
          # The renderer may return an error SVG when GitHub data is unavailable.
          # Only publish a graph that contains the expected line and area paths.
          grep -Fq 'class="ct-line"' assets/generated/activity-graph.svg
          grep -Fq 'class="ct-area"' assets/generated/activity-graph.svg

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile statistics"
          git push
